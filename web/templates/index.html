<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PortLabel — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c0f;
      --surface: #111318;
      --surface-hover: #161920;
      --border: #1e2229;
      --accent: #00e5a0;
      --accent-dim: rgba(0, 229, 160, 0.1);
      --danger: #ff4d4d;
      --danger-dim: rgba(255, 77, 77, 0.1);
      --text: #e8eaf0;
      --text-dim: #717786;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
    }

    .title {
      font-family: var(--sans);
      font-size: 1.25rem;
      letter-spacing: 0.05em;
    }
    .title span { color: var(--accent); }

    .tag {
      font-size: 0.7rem;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* ── Add Form Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .add-form {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    input {
      background: #0d0f14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }

    button {
      font-family: var(--mono);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 0 1.25rem;
      align-self: flex-end;
      height: 38px;
    }
    .btn-primary:hover { opacity: 0.9; }

    /* ── Table Card ── */
    .table-card { padding: 0; overflow: hidden; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.8rem;
    }

    th {
      background: rgba(255, 255, 255, 0.015);
      color: var(--text-dim);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-hover); }

    .domain-name {
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .domain-name a {
      color: inherit;
      text-decoration: none;
    }
    .domain-name a:hover { color: var(--accent); text-decoration: underline; }

    .badge {
      font-size: 0.6rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-online { background: var(--accent-dim); color: var(--accent); }
    .badge-offline { background: rgba(255,255,255,0.05); color: var(--text-dim); }

    .badge-enabled { background: var(--accent-dim); color: var(--accent); }
    .badge-disabled { background: var(--danger-dim); color: var(--danger); }

    .actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .btn-action {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 8px;
      font-size: 0.7rem;
    }
    .btn-action:hover {
      border-color: var(--text);
      color: var(--text);
    }
    .btn-danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .empty-state {
      padding: 2.5rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <circle cx="17.5" cy="17.5" r="3.5"/>
        </svg>
      </div>
      <div class="title">Port<span>label</span></div>
    </div>
    <span class="tag">Local Domain Dashboard</span>
  </header>

  <div class="card">
    <form class="add-form" id="addForm" onsubmit="handleAdd(event)">
      <div class="input-group">
        <label>Service Name</label>
        <input type="text" id="serviceName" placeholder="e.g. n8n, nextcloud" required autocomplete="off"/>
      </div>
      <div class="input-group">
        <label>Local Port</label>
        <input type="number" id="servicePort" placeholder="e.g. 8080" required min="1" max="65535"/>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Add Mapping</button>
    </form>
  </div>

  <div class="card table-card">
    <table>
      <thead>
        <tr>
          <th>Service / URL</th>
          <th>Port</th>
          <th>Routing</th>
          <th>Port Listener</th>
          <th style="text-align: right;">Actions</th>
        </tr>
      </thead>
      <tbody id="domainsBody">
        <tr>
          <td colspan="5" class="empty-state">Loading domains...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  async function fetchDomains() {
    try {
      const res = await fetch('/api/domains');
      const data = await res.json();
      renderTable(data.domains || []);
    } catch (err) {
      console.error(err);
    }
  }

  function renderTable(domains) {
    const tbody = document.getElementById('domainsBody');
    if (!domains.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No domain mappings yet. Add one above!</td></tr>';
      return;
    }

    tbody.innerHTML = domains.map(d => `
      <tr>
        <td>
          <div class="domain-name">
            <a href="http://${d.domain}" target="_blank">${d.domain}</a>
          </div>
        </td>
        <td><code>${d.port}</code></td>
        <td>
          <span class="badge ${d.status === 'enabled' ? 'badge-enabled' : 'badge-disabled'}">
            ${d.status}
          </span>
        </td>
        <td>
          <span class="badge ${d.online ? 'badge-online' : 'badge-offline'}">
            ${d.online ? 'Active' : 'Offline'}
          </span>
        </td>
        <td>
          <div class="actions">
            <button class="btn-action" onclick="toggleDomain('${d.name}')">
              ${d.status === 'enabled' ? 'Disable' : 'Enable'}
            </button>
            <button class="btn-action btn-danger" onclick="deleteDomain('${d.name}')">
              Remove
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  async function handleAdd(e) {
    e.preventDefault();
    const nameInput = document.getElementById('serviceName');
    const portInput = document.getElementById('servicePort');
    const btn = document.getElementById('submitBtn');

    btn.disabled = true;
    btn.textContent = 'Adding...';

    try {
      const res = await fetch('/api/domains', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nameInput.value, port: portInput.value })
      });
      const data = await res.json();
      if (!data.success) {
        alert(data.error || 'Failed to add service');
      } else {
        nameInput.value = '';
        portInput.value = '';
        await fetchDomains();
      }
    } catch (err) {
      alert('Error contacting server');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add Mapping';
    }
  }

  async function toggleDomain(name) {
    await fetch('/api/domains/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    fetchDomains();
  }

  async function deleteDomain(name) {
    if (!confirm(`Remove ${name}.local?`)) return;
    await fetch('/api/domains/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    fetchDomains();
  }

  fetchDomains();
  setInterval(fetchDomains, 4000);
</script>
</body>
</html>
